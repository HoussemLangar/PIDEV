# VirtualHost par défaut pour IP et localhost
<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1 192.168.171.135
    
    DocumentRoot /var/www/html/public
    
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/default_error.log
    CustomLog ${APACHE_LOG_DIR}/default_access.log combined
    
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
</VirtualHost>

# VirtualHost pour santea.local HTTP
<VirtualHost *:80>
    ServerName santea.local
    ServerAlias www.santea.local santea.tn www.santea.tn
    
    DocumentRoot /var/www/html/public
    
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/santea_error.log
    CustomLog ${APACHE_LOG_DIR}/santea_access.log combined
    
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
</VirtualHost>

# VirtualHost par défaut HTTPS pour IP
<VirtualHost *:443>
    ServerName localhost
    ServerAlias 127.0.0.1 192.168.171.135
    
    DocumentRoot /var/www/html/public
    
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>
    
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
    
    ErrorLog ${APACHE_LOG_DIR}/default_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/default_ssl_access.log combined
    
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
</VirtualHost>

