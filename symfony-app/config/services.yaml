# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    geoip_db_path: '%kernel.project_dir%/var/geoip/GeoLite2-Country.mmdb'
    geoip_api_url: '%env(resolve:GEOIP_API_URL)%'
    jitsi_server_url: '%env(JITSI_SERVER_URL)%'
    ai_api_base_url: '%env(resolve:AI_API_BASE_URL)%'
    ai_api_key: '%env(resolve:AI_API_KEY)%'
    ai_model: '%env(resolve:AI_MODEL)%'
    content_forbidden_words:
        - spam
        - arnaque
        - insultant
        - obscenite
        - menace
        - haine
        - violence
        - harcelement
        - discriminant
        - faux

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Twig/Components/'

    App\Twig\Components\:
        resource: '../src/Twig/Components/'
        autowire: true
        autoconfigure: true

    App\Service\InvoiceService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Security\GeoIpService:
        arguments:
            $geoIpDbPath: '%geoip_db_path%'
            $geoIpApiUrl: '%geoip_api_url%'

    App\Service\ForbiddenWordsFilterService:
        arguments:
            $forbiddenWords: '%content_forbidden_words%'

    App\Service\Ai\AiGatewayService:
        arguments:
            $baseUrl: '%ai_api_base_url%'
            $apiKey: '%ai_api_key%'
            $model: '%ai_model%'

    App\Service\MessageRealtimePublisher:
        arguments:
            $hub: '@?mercure.hub.default'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
