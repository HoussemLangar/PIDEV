security:
    # Configuration du hashage de mot de passe
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User:
            algorithm: auto

    # Providers - comment Symfony trouve les utilisateurs
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email  # Utilise l'email comme identifiant de connexion

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            
            # Configuration du formulaire de login
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                success_handler: App\Security\LoginSuccessHandler  
                default_target_path: app_home
                username_parameter: _username  # correspond au champ email
                password_parameter: _password

            # Authentification OAuth
            custom_authenticators:
                - App\Security\GoogleAuthenticator
                - App\Security\FacebookAuthenticator
            
            # Configuration du logout
            logout:
                path: app_logout
                target: login
            
            # Se souvenir de moi
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800  # 1 semaine en secondes
                path: /
                always_remember_me: false

    # Contrôle d'accès
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

    # Configuration des rôles hiérarchiques (optionnel)
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_MEDECIN: ROLE_USER
        ROLE_PATIENT: ROLE_USER
        ROLE_PHARMACIEN: ROLE_USER
        ROLE_COACH: ROLE_USER
        ROLE_NUTRITIONNISTE: ROLE_USER