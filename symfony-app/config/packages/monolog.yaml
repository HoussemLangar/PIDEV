monolog:
    channels:
        - deprecation
        - mailer
        - payment
        - document
        - ai
        - security_audit

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            payment:
                type: stream
                path: "%kernel.logs_dir%/payment.log"
                level: info
                channels: ["payment"]
            document:
                type: stream
                path: "%kernel.logs_dir%/document.log"
                level: info
                channels: ["document"]
            ai:
                type: stream
                path: "%kernel.logs_dir%/ai.log"
                level: info
                channels: ["ai"]
            security_audit:
                type: stream
                path: "%kernel.logs_dir%/security_audit.log"
                level: info
                channels: ["security_audit"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            payment:
                type: stream
                path: php://stderr
                level: info
                channels: [payment]
                formatter: monolog.formatter.json
            document:
                type: stream
                path: php://stderr
                level: info
                channels: [document]
                formatter: monolog.formatter.json
            ai:
                type: stream
                path: php://stderr
                level: info
                channels: [ai]
                formatter: monolog.formatter.json
            security_audit:
                type: stream
                path: php://stderr
                level: info
                channels: [security_audit]
                formatter: monolog.formatter.json
