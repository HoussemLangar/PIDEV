global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: apache_exporter
    static_configs:
      - targets: ["apache-exporter:9117"]

  - job_name: mysql_exporter_galera
    static_configs:
      - targets:
          - "mysql-exporter-node1:9104"
          - "mysql-exporter-node2:9104"
          - "mysql-exporter-node3:9104"
