version: '3.8'

services:
  # =========================
  # Service PHP / Apache (Symfony)
  # =========================
  web:
    container_name: pidev-web
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./symfony-app:/var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://symfony:symfony@db:3306/pidev?serverVersion=8.0"
      BLACKFIRE_SERVER_ID: ${BLACKFIRE_SERVER_ID:-}
      BLACKFIRE_SERVER_TOKEN: ${BLACKFIRE_SERVER_TOKEN:-}
      BLACKFIRE_AGENT_SOCKET: tcp://blackfire:8307
    depends_on:
      - db
    networks:
      - pidev-network
    restart: unless-stopped

    # 🔥 OBLIGATOIRE — corrige docker-compose exec muet
    tty: true
    stdin_open: true

  # =========================
  # Service Blackfire (profiling)
  # =========================
  blackfire:
    image: blackfire/blackfire:2
    container_name: pidev-blackfire
    profiles:
      - profiling
    environment:
      BLACKFIRE_SERVER_ID: ${BLACKFIRE_SERVER_ID:-}
      BLACKFIRE_SERVER_TOKEN: ${BLACKFIRE_SERVER_TOKEN:-}
      BLACKFIRE_CLIENT_ID: ${BLACKFIRE_CLIENT_ID:-}
      BLACKFIRE_CLIENT_TOKEN: ${BLACKFIRE_CLIENT_TOKEN:-}
    networks:
      - pidev-network
    restart: unless-stopped

  # =========================
  # Service MySQL 8.0
  # =========================
  db:
    image: mysql:8.0
    container_name: pidev-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pidev
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - pidev-network
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  # =========================
  # Service phpMyAdmin
  # =========================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pidev-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 100M
    depends_on:
      - db
    networks:
      - pidev-network
    restart: unless-stopped

  # =========================
  # Service JavaFX
  # =========================
  javafx:
    build:
      context: ./docker/javafx
      dockerfile: Dockerfile
    container_name: pidev-javafx
    working_dir: /workspace/javafx-app
    volumes:
      - ./javafx-app:/workspace/javafx-app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      DISPLAY: ${DISPLAY:-:0}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: pidev
      DB_USER: symfony
      DB_PASSWORD: symfony
    command: tail -f /dev/null
    networks:
      - pidev-network
    restart: unless-stopped
    tty: true
    stdin_open: true

  # javafx-xpra:
  #   build:
  #     context: ./docker/javafx-xpra
  #     dockerfile: Dockerfile
  #   container_name: pidev-javafx-xpra
  #   working_dir: /workspace/javafx-app
  #   volumes:
  #     - ./javafx-app:/workspace/javafx-app
  #   ports:
  #     - "127.0.0.1:14500:14500"
  #   environment:
  #     XPRA_DISPLAY: ":100"
  #     XPRA_PORT: "14500"
  #     APP_COMMAND: "cd /workspace/javafx-app && mvn javafx:run"
  #     DB_HOST: db
  #     DB_PORT: 3306
  #     DB_NAME: pidev
  #     DB_USER: symfony
  #     DB_PASSWORD: symfony
  #   command: bash -lc /usr/local/bin/start-xpra.sh
  #   networks:
  #     - pidev-network
  #   restart: unless-stopped
  #   tty: true
  #   stdin_open: true

# =========================
# Réseaux
# =========================
networks:
  pidev-network:
    driver: bridge

# =========================
# Volumes
# =========================
volumes:
  db-data:
