version: '3.8'

services:
  # =========================
  # Service PHP / Apache (Symfony)
  # =========================
  web:
    container_name: pidev-web
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./symfony-app:/var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://symfony:symfony@db:3306/pidev?serverVersion=8.0"
      BLACKFIRE_SERVER_ID: ${BLACKFIRE_SERVER_ID:-}
      BLACKFIRE_SERVER_TOKEN: ${BLACKFIRE_SERVER_TOKEN:-}
      BLACKFIRE_AGENT_SOCKET: tcp://blackfire:8307
    depends_on:
      - db
    networks:
      - pidev-network
    restart: unless-stopped

    # 🔥 OBLIGATOIRE — corrige docker-compose exec muet
    tty: true
    stdin_open: true

  # =========================
  # Service Blackfire (profiling)
  # =========================
  blackfire:
    image: blackfire/blackfire:2
    container_name: pidev-blackfire
    profiles:
      - profiling
    environment:
      BLACKFIRE_SERVER_ID: ${BLACKFIRE_SERVER_ID:-}
      BLACKFIRE_SERVER_TOKEN: ${BLACKFIRE_SERVER_TOKEN:-}
      BLACKFIRE_CLIENT_ID: ${BLACKFIRE_CLIENT_ID:-}
      BLACKFIRE_CLIENT_TOKEN: ${BLACKFIRE_CLIENT_TOKEN:-}
    networks:
      - pidev-network
    restart: unless-stopped

  # =========================
  # Service MySQL 8.0
  # =========================
  db:
    image: mysql:8.0
    container_name: pidev-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pidev
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - pidev-network
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  # =========================
  # Service phpMyAdmin
  # =========================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pidev-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 100M
    depends_on:
      - db
    networks:
      - pidev-network
    restart: unless-stopped

  # =========================
  # Service JavaFX
  # =========================
  javafx:
    image: eclipse-temurin:17-jdk
    container_name: pidev-javafx
    working_dir: /app
    volumes:
      - ./javafx-app:/app
    command: tail -f /dev/null
    networks:
      - pidev-network
    restart: unless-stopped

# =========================
# Réseaux
# =========================
networks:
  pidev-network:
    driver: bridge

# =========================
# Volumes
# =========================
volumes:
  db-data:
